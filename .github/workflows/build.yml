name: Build SwitchCraft NX

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchCraftNX-nro
          path: SwitchCraftNX.nro
