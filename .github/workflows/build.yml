
name: Build SwitchCraft NX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Diagnosticar arquivos
        shell: bash
        run: |
          echo "=== DIRETORIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS DO PROJETO ==="
          ls -la
          echo "=== ARQUIVOS ATE 3 NIVEIS ==="
          find . -maxdepth 3 -type f -print
          echo "=== VERIFICAR MAKEFILE ==="
          if [ -f Makefile ]; then
            echo "Makefile encontrado na raiz."
            cat Makefile
          else
            echo "ERRO: Makefile nao encontrado na raiz."
            exit 1
          fi
          echo "=== VERIFICAR CODIGO-FONTE ==="
          if [ -f source/main.c ]; then
            echo "source/main.c encontrado."
          else
            echo "ERRO: source/main.c nao encontrado."
            exit 1
          fi

      - name: Compilar NRO
        shell: bash
        run: |
          make -f Makefile

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: SwitchCraftNX-nro
          path: "*.nro"
          if-no-files-found: error
